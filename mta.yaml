_schema-version: 3.3.0
ID: SAP_CAPM_FIORI_SPRINT
version: 1.0.0
description: "Rental Equipment Tracking and Condition Logging"

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  - name: SAP_CAPM_FIORI_SPRINT-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: SAP_CAPM_FIORI_SPRINT-auth
      - name: SAP_CAPM_FIORI_SPRINT-db
      - name: SAP_CAPM_FIORI_SPRINT-destination

  - name: SAP_CAPM_FIORI_SPRINT-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: SAP_CAPM_FIORI_SPRINT-db

  - name: SAP_CAPM_FIORI_SPRINT-rental-equipment
    type: html5
    path: app/rental-equipment
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npx --yes @ui5/cli@4 build --config-path ui5.yaml --dest dist

  - name: SAP_CAPM_FIORI_SPRINT-ui-content
    type: com.sap.application.content
    path: .
    requires:
      - name: SAP_CAPM_FIORI_SPRINT-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: SAP_CAPM_FIORI_SPRINT-rental-equipment
          artifacts:
            - dist
          target-path: resources/

  - name: SAP_CAPM_FIORI_SPRINT
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: SAP_CAPM_FIORI_SPRINT-auth
      - name: SAP_CAPM_FIORI_SPRINT-destination
      - name: SAP_CAPM_FIORI_SPRINT-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: SAP_CAPM_FIORI_SPRINT-portal-deployer
    type: com.sap.application.content
    path: app/portal
    requires:
      - name: SAP_CAPM_FIORI_SPRINT-portal
        parameters:
          content-target: true
          service-key:
            name: SAP_CAPM_FIORI_SPRINT-portal-key
            config:
              content-endpoint: developer
      - name: SAP_CAPM_FIORI_SPRINT-auth
      - name: SAP_CAPM_FIORI_SPRINT-html5-repo-host

resources:

  - name: SAP_CAPM_FIORI_SPRINT-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: SAP_CAPM_FIORI_SPRINT-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  - name: SAP_CAPM_FIORI_SPRINT-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: SAP_CAPM_FIORI_SPRINT-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: SAP_CAPM_FIORI_SPRINT-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: SAP_CAPM_FIORI_SPRINT-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: SAP_CAPM_FIORI_SPRINT-portal
    type: org.cloudfoundry.managed-service
    parameters:
      service: build-workzone-standard
      service-plan: standard
