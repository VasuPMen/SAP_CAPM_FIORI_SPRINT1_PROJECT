name: Validate CAP Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate CDS model and services
        run: npm run validate

      - name: Validate JavaScript syntax
        run: |
          node --check srv/server.js
          node --check srv/service/rental-service.cjs
          node --check srv/service/inspection-service.cjs
          node --check srv/service/maintenance-service.cjs
          node --check srv/service/billing-service.cjs
          node --check srv/worker/index.js
          node --check srv/worker/outbox-bootstrap.cjs
          node --check srv/worker/outbox-worker.cjs
